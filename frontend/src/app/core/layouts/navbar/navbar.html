<header class="bg-white shadow-md">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">

    <!-- Logo + Search bar -->
    <div class="flex items-center space-x-4">
      <a routerLink="/" class="text-xl font-bold text-blue-600">SocialApp</a>
      <app-search-bar></app-search-bar>
    </div>

    @if (!isAuthenticated) {
    <div class="space-x-4">
      <a routerLink="/login" class="text-gray-600 hover:text-blue-500">Login</a>
      <a routerLink="/register" class="text-gray-600 hover:text-blue-500">Register</a>
    </div>
    } @else {
    <div class="flex items-center space-x-4">

      <!-- create post button -->
      <a routerLink="/create-post" class="flex items-center gap-2 text-gray-500 hover:text-blue-600 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span>New Post</span>
      </a>

      <a [routerLink]="['/profile', currentUserId]" class="text-gray-500 hover:text-blue-600">
        My Profile
      </a>

      <!-- notifications -->
      <app-notification-dropdown></app-notification-dropdown>

      <!-- user menu -->
      <div class="relative">
        <button (click)="toggleMenu()" class="flex items-center space-x-2 focus:outline-none">
          <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">
            {{ userName.charAt(0).toUpperCase() }}
          </div>
          <span class="text-gray-600">{{ userName }}</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        @if (menuOpen) {
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10">
          <button (click)="logout()" class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100">
            Logout
          </button>
        </div>
        }
      </div>
    </div>
    }
  </div>
</header>

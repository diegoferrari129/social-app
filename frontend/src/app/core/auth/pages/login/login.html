<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Accedi</h2>
    <form (ngSubmit)="onSubmit()">
      <!-- campi email, password -->
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required class="w-full px-3 py-2 border rounded-lg">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Password</label>
        <input type="password" [(ngModel)]="password" name="password" required
          class="w-full px-3 py-2 border rounded-lg">
      </div>
      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">
        Login
      </button>
      @if (errorMessage) {
      <p class="text-red-500 text-sm mt-3 text-center">{{ errorMessage }}</p>
      }
    </form>

    <!-- Pulsante demo -->
    <div class="mt-4 text-center">
      <button (click)="demoLogin()" class="text-blue-500 hover:underline">
        🔥 Accedi con account demo (user1 / password123)
      </button>
    </div>

    <p class="text-center text-sm text-gray-600 mt-4">
      Non hai un account? <a routerLink="/register" class="text-blue-500 hover:underline">Registrati</a>
    </p>
  </div>
</div>

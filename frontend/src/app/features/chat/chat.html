<div class="fixed bottom-4 right-4 w-96 h-96 bg-white rounded-lg shadow-xl flex flex-col z-50">
  <!-- Header -->
  <div class="bg-blue-500 text-white px-4 py-2 rounded-t-lg flex justify-between items-center">
    <div class="flex items-center gap-2">
      <img [src]="conversation?.otherUserImgUrl || '/assets/default-avatar.png'"
        class="w-6 h-6 rounded-full object-cover" alt="Avatar" />
      <span>Chat con {{ conversation?.otherUserName || '...' }}</span>
    </div>
    <button (click)="closePopup()" class="text-white hover:text-gray-200">✕</button>
  </div>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto p-4 space-y-2">
    @for (msg of messages; track $index) {
    <div class="flex" [class.justify-end]="msg.senderId === currentUserId">
      <div class="max-w-xs rounded-lg p-2" [class.bg-blue-500]="msg.senderId === currentUserId"
        [class.text-white]="msg.senderId === currentUserId" [class.bg-gray-200]="msg.senderId !== currentUserId">
        {{ msg.text }}
        <div class="text-xs mt-1 opacity-70">{{ msg.sentAt | date:'shortTime' }}</div>
      </div>
    </div>
    }
    <div #scrollAnchor></div>
  </div>

  <!-- Input -->
  <div class="p-4 border-t">
    <div class="flex gap-2">
      <input type="text" [(ngModel)]="newMessageText" placeholder="Scrivi un messaggio..."
        class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring" (keyup.enter)="sendMessage()">
      <button (click)="sendMessage()" [disabled]="isSending"
        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 disabled:opacity-50">
        Invia
      </button>
    </div>
  </div>
</div>

<div class="container mx-auto px-4 py-8">
  <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
    <aside class="md:col-span-3">
      <app-suggested-users></app-suggested-users>
    </aside>

    <main class="md:col-span-6">
      @if (loading) {
      <div>Caricamento...</div>
      } @else if (error) {
      <div class="text-red-500">{{ error }}</div>
      } @else if (user) {
      <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex items-start gap-4">
          <img [src]="user.imgUrl || '/default-avatar.png'" class="w-24 h-24 rounded-full object-cover">
          <div class="flex-1">
            <div class="flex justify-between items-start">
              <div>
                <h2 class="text-2xl font-bold">{{ user.name }}</h2>
                <p class="text-gray-600">{{ user.bio }}</p>
              </div>
              @if (!isOwnProfile) {
              <app-follow-button [targetUserId]="user.id" [isFollowing]="isFollowing"
                (followChanged)="onFollowChanged($event)">
              </app-follow-button>
              }
              @if (isOwnProfile) {
              <button (click)="toggleEdit()" class="bg-gray-200 px-3 py-1 rounded">Edit Profile</button>
              }
            </div>
            <div class="flex gap-4 mt-2 text-sm">
              <span><strong>{{ user.followersCount || 0 }}</strong> follower</span>
              <span><strong>{{ user.followingCount || 0 }}</strong> following</span>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-6">
        <h3 class="text-xl font-bold mb-4">Post</h3>
        <app-user-post-list [userId]="user.id"></app-user-post-list>
      </div>
      }
    </main>
  </div>
</div>

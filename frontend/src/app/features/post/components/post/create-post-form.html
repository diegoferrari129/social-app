<!-- create-post.component.html -->
<div class="max-w-2xl mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">+New Post</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Title</label>
      <input type="text" [(ngModel)]="title" name="title" required class="w-full px-3 py-2 border rounded-lg" />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Content</label>
      <textarea [(ngModel)]="content" name="content" rows="5" required
        class="w-full px-3 py-2 border rounded-lg"></textarea>
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">image (optional)</label>
      <input type="text" [(ngModel)]="postImg" name="postImg" class="w-full px-3 py-2 border rounded-lg" />
    </div>
    @if (errorMessage) {
    <div class="text-red-500 mb-4">{{ errorMessage }}</div>
    }
    <button type="submit" [disabled]="isSubmitting"
      class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 disabled:opacity-50">
      {{ isSubmitting ? 'Post begin created...' : '+ New Post' }}
    </button>
  </form>
</div>

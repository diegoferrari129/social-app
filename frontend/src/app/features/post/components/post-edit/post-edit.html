<div class="max-w-2xl mx-auto p-4">
  @if (loading) {
  <div class="text-center py-8">Loading post...</div>
  } @else if (error) {
  <div class="text-red-500 text-center">{{ error }}</div>
  } @else if (post) {
  <h2 class="text-2xl font-bold mb-4">Edit Post</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Content *</label>
      <textarea [(ngModel)]="content" name="content" rows="6" required
        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"></textarea>
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Image URL (optional)</label>
      <input type="text" [(ngModel)]="postImg" name="postImg"
        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring">
    </div>
    <div class="flex gap-2">
      <button type="submit" [disabled]="saving"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 disabled:opacity-50">
        {{ saving ? 'Saving...' : 'Update Post' }}
      </button>
      <button type="button" (click)="deletePost()"
        class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 disabled:opacity-50" [disabled]="saving">
        Delete
      </button>
      <button type="button" (click)="cancel()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">
        Cancel
      </button>
    </div>
  </form>
  }
</div>

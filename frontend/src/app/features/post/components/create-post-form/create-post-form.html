<!-- create-post.component.html -->
<div class="max-w-2xl mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">+New Post</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label>Contenuto</label>
      <textarea [(ngModel)]="content" name="content" rows="6" required></textarea>
    </div>
    <div class="mb-4">
      <label>URL immagine (opzionale)</label>
      <input type="text" [(ngModel)]="postImg" name="postImg">
    </div>
    <button type="submit">Pubblica</button>
  </form>
</div>
